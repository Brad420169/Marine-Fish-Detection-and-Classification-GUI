[workspace]
name = "auto-fish-detect-gui"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tasks]
GUI = "python scripts/app.py"
setup-sam = "python scripts/sam/assist.py"

[dependencies]
python = "3.11.*"
pyqt6 = "*"
# OpenCV 5 removed the Darknet importer used by .weights models.
opencv = ">=4.10,<5"
pandas = "*"
numpy = "*"
pip = "*"
supervision = ">=0.30.0,<0.31"

[pypi-dependencies]
rfdetr = ">=1.9.3,<2"
ultralytics = ">=8.4,<9"
lap = ">=0.5,<0.6"

# Keep CUDA 12.6 on Windows/Linux for GTX 1070 (Pascal) compatibility.
[target.win-64.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.22.1", index = "https://download.pytorch.org/whl/cu126" }

[target.linux-64.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.22.1", index = "https://download.pytorch.org/whl/cu126" }

# Use OpenBLAS, not MKL, on Windows. MKL pulls in llvm-openmp (libomp.dll),
# which clashes with the Intel OpenMP (libiomp5md.dll) bundled in the pip
# torch wheel and aborts the process with "OMP: Error #15" during detection.
[target.win-64.dependencies]
libblas = { version = "*", build = "*openblas" }

# Apple Silicon wheels come from PyPI, not the NVIDIA CUDA index.
[target.osx-arm64.pypi-dependencies]
torch = "==2.7.1"
torchvision = "==0.22.1"

# RF-DETR requires this range; prevent the conda solve from pinning 0.11+.
[target.osx-arm64.dependencies]
pydeprecate = ">=0.9,<0.10"
